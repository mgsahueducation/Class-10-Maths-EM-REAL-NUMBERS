<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real Numbers: Interactive Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f4f6f1;--grid:#dfe5db;--ink:#14213d;--soft:#4a5673;--gold:#f2a900;--teal:#12877a;--coral:#e4572e;--card:#fff}
@media (prefers-color-scheme:dark){:root{--paper:#0f1a2e;--grid:#1a2742;--ink:#f1f4ee;--soft:#a9b4cc;--card:#17243d}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Nunito Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;overflow-x:hidden}
nav{display:flex;gap:8px;align-items:center;padding:12px 20px;flex-wrap:wrap}
nav button,.ctl button{font:inherit;font-weight:800;border:2px solid var(--ink);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer}
nav button.on{background:var(--ink);color:var(--paper)}
nav .sp{flex:1}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.poster{display:none;min-height:calc(100vh - 70px);padding:10px 28px 40px;grid-template-columns:minmax(260px,5fr) 7fr;gap:36px;align-items:start}
.poster.on{display:grid}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(2.2rem,5vw,4.2rem);line-height:1.02;margin-bottom:10px}
.tag{font-family:Fraunces,Georgia,serif;font-size:clamp(1.1rem,2vw,1.5rem);color:var(--teal);margin-bottom:22px}
.facts{list-style:none;padding:0;display:grid;gap:10px}
.facts li{background:var(--card);border-left:6px solid var(--gold);padding:10px 14px;border-radius:4px 12px 12px 4px;font-size:1.02rem;line-height:1.4}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ctl label{font-weight:800;display:flex;gap:6px;align-items:center}
.ctl input{width:92px;font:inherit;font-weight:800;padding:7px 9px;border:2px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink)}
.ctl .go{background:var(--gold);color:#14213d;border-color:#14213d}
.stage{display:grid;gap:12px}
.stage>div{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:14px 18px;font-size:clamp(1.05rem,2vw,1.45rem);line-height:1.5;opacity:0;transform:translateY(14px) scale(.98);transition:opacity .5s,transform .5s;pointer-events:none}
.stage>div.on{opacity:1;transform:none;pointer-events:auto}
.stage>div.result{background:var(--ink);color:var(--paper);font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1.3rem,3vw,2rem)}
.stage>div.result b{color:var(--gold)}
.stage>div.bad{background:var(--coral);color:#fff}
b.hl{color:var(--coral)}b.zero{color:var(--teal);background:rgba(18,135,122,.15);padding:0 6px;border-radius:6px}
.bar{display:flex;gap:3px;margin-top:8px;height:16px}
.bar i{background:var(--teal);border-radius:4px;transform-origin:left;transform:scaleX(0);transition:transform .6s}
.on .bar i{transform:scaleX(1)}
.bar i.rem{background:repeating-linear-gradient(45deg,var(--coral),var(--coral) 4px,transparent 4px,transparent 8px)}
.chip{display:inline-block;background:var(--gold);color:#14213d;font-weight:800;border-radius:8px;padding:0 8px;margin:0 2px}
.dig{font-family:Fraunces,Georgia,serif;font-size:1.5em;word-break:break-all;letter-spacing:2px}
.dig span{display:inline-block;opacity:0}
.on .dig span{animation:pop .35s forwards}
.dig .rp{color:var(--coral);text-decoration:overline}
@keyframes pop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
small.hint{display:block;color:var(--soft);padding:0 28px 20px}
body.clean nav,body.clean .ctl,body.clean small.hint{display:none}
body.clean .poster{min-height:100vh;padding-top:30px}
@media(max-width:820px){.poster.on{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:.01s!important}}
body{padding-bottom:60px}
.brand{position:fixed;left:0;right:0;bottom:0;z-index:9;text-align:center;padding:12px;background:var(--ink);color:var(--paper);font-family:Fraunces,Georgia,serif;font-weight:800;font-size:clamp(1rem,2.4vw,1.4rem);border-top:4px solid var(--gold)}
.stage>div.key{background:var(--gold);color:#14213d;font-weight:800;border-color:#14213d}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<div class="brand">MG Sahu Education Blog</div>
<small class="hint">Keys: ← → switch poster · Space replay · S step · H hide controls (clean screen for recording)</small>

<script>
const $=(s,r=document)=>r.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const gcd=(a,b)=>b?gcd(b,a%b):a;
function factor(n){const m={};for(let p=2;p*p<=n;p++)while(n%p==0){m[p]=(m[p]||0)+1;n/=p}if(n>1)m[n]=(m[n]||0)+1;return m}
function fmt(m){const k=Object.keys(m).map(Number).sort((a,b)=>a-b);return k.length?k.map(p=>p+(m[p]>1?'<sup>'+m[p]+'</sup>':'')).join(' × '):'1'}
const val=m=>Object.keys(m).reduce((t,p)=>t*Math.pow(+p,m[p]),1);
const isPrime=n=>n>1&&Object.keys(factor(n)).length==1&&factor(n)[n]==1;

const POSTERS=[
{name:'1 · Division Lemma',title:'Euclid’s Division Lemma',tag:'Divide until nothing is left.',key:'a = bq + r, where 0 ≤ r &lt; b. The last non-zero divisor is the HCF.',
facts:['For positive integers a and b: <b>a = bq + r, 0 ≤ r &lt; b</b>','Euclid’s algorithm: keep dividing until the remainder is 0. The last divisor is the <b>HCF</b>.','Every integer is 2q or 2q+1; squares are 3m or 3m+1; cubes are 9m, 9m+1 or 9m+8.','Show every step: marks are given per step.'],
inputs:[['a',404],['b',96]],
build([a,b]){let B=Math.max(a,b),S=Math.min(a,b);if(S<1)return['<div>Enter positive numbers.</div>'];const o=[];
while(S){const q=Math.floor(B/S),r=B%S;let bar='';if(q<=16){for(let i=0;i<q;i++)bar+=`<i style="flex:${S}"></i>`;if(r)bar+=`<i class="rem" style="flex:${r}"></i>`}
o.push(`${B} = ${S} × ${q} + <b class="${r?'hl':'zero'}">${r}</b><div class="bar">${bar}</div>`);B=S;S=r}
o.push(`<div class="result">HCF(${a}, ${b}) = <b>${B}</b></div>`.replace(/^<div[^>]*>|<\/div>$/g,''));return o.map((h,i)=>i==o.length-1?'§'+h:h)}},
{name:'2 · Fundamental Theorem',title:'Fundamental Theorem of Arithmetic',tag:'Every composite number has one prime fingerprint.',key:'HCF × LCM = a × b (true for two numbers only).',
facts:['Every composite number is a product of primes, and the factorisation is <b>unique</b> (apart from order).','<b>HCF</b> = smallest powers of <i>common</i> primes.','<b>LCM</b> = greatest powers of <i>all</i> primes.','<b>HCF × LCM = a × b</b> (two numbers only).','6ⁿ has no factor 5, so it never ends in 0.'],
inputs:[['a',12],['b',18]],
build([a,b]){if(a<2||b<2||a>1e6||b>1e6)return['<div>Enter numbers from 2 to 1,000,000.</div>'];const A=factor(a),B=factor(b),H={},L={};
for(const p in A){if(B[p])H[p]=Math.min(A[p],B[p]);L[p]=Math.max(A[p],B[p]||0)}for(const p in B)if(!L[p])L[p]=B[p];
const h=val(H),l=val(L);
return[`${a} = <span class="chip">${fmt(A)}</span>`,`${b} = <span class="chip">${fmt(B)}</span>`,
`HCF: smallest powers of common primes<br>= <b class="zero">${fmt(H)}</b> = <b>${h}</b>`,
`LCM: greatest powers of all primes<br>= <b class="zero">${fmt(L)}</b> = <b>${l}</b>`,
`Check: ${h} × ${l} = ${h*l} = ${a} × ${b}`,
`§HCF = <b>${h}</b> · LCM = <b>${l}</b>`]}},
{name:'3 · Irrational Numbers',title:'Irrational Numbers',tag:'A proof by contradiction, step by step.',key:'If a prime p divides a², then p divides a.',
facts:['If a prime p divides a², then p divides a.','Prove √2, √3, √5 irrational; then 3 + 2√5, 5 − √3, 1/√2 follow.','Rational ± irrational = irrational. Non-zero rational × irrational = irrational.','Always write the contradiction statement.'],
inputs:[['p',2]],
build([p]){if(!isPrime(p))return['<div class="bad">Enter a prime number (2, 3, 5, 7, 11…).</div>'];
let d='';const n=34,x=BigInt(p)*10n**BigInt(2*n);let lo=0n,hi=10n**BigInt(n+2);while(lo<hi){const m=(lo+hi+1n)/2n;if(m*m<=x)lo=m;else hi=m-1n}
const s=lo.toString();const dg=(s[0]+'.'+s.slice(1)).split('').map((c,i)=>`<span style="animation-delay:${i*70}ms">${c}</span>`).join('');
return[`<b>Step 1.</b> Assume √${p} is rational: √${p} = a/b, with a and b co-prime, b ≠ 0.`,
`<b>Step 2.</b> Square both sides: a² = ${p}b².`,
`<b>Step 3.</b> ${p} divides a², so <b class="zero">${p} divides a</b>. Write a = ${p}c.`,
`<b>Step 4.</b> Then ${p*p}c² = ${p}b², so b² = ${p}c².`,
`<b>Step 5.</b> So ${p} divides b², hence <b class="zero">${p} divides b</b>.`,
`<b>Step 6.</b> ${p} divides both a and b. <b class="hl">This contradicts our assumption that a and b are co-prime.</b>`,
`§Hence √${p} is <b>irrational</b>.`,
`Its digits never end and never repeat:<div class="dig">${dg}…</div>`]}},
{name:'4 · Decimal Expansions',title:'Decimal Expansions',tag:'Look at the denominator. Predict the decimal.',key:'In lowest terms, p/q terminates only if q = 2ᵐ × 5ⁿ.',
facts:['Rational: terminating, or non-terminating repeating.','Irrational: non-terminating, non-repeating.','In lowest terms, p/q terminates only if <b>q = 2ᵐ × 5ⁿ</b>.','Always reduce the fraction first.'],
inputs:[['p',13],['q',3125]],
build([p,q]){if(p<1||q<2||q>1e6)return['<div>Enter p ≥ 1 and q from 2 to 1,000,000.</div>'];
const g=gcd(p,q),P=p/g,Q=q/g,F=factor(Q),bad=Object.keys(F).filter(k=>k!=2&&k!=5),ok=!bad.length;
const ip=Math.floor(P/Q);let r=P%Q;const seen={},dg=[];
while(r&&!(r in seen)&&dg.length<60){seen[r]=dg.length;r*=10;dg.push(Math.floor(r/Q));r%=Q}
const st=r&&(r in seen)?seen[r]:-1;
const spans=dg.map((c,i)=>`<span class="${st>=0&&i>=st?'rp':''}" style="animation-delay:${i*90}ms">${c}</span>`).join('');
return[`Lowest terms: ${p}/${q}${g>1?` = <b>${P}/${Q}</b> (divided by ${g})`:' (already reduced)'}`,
`Denominator: ${Q} = <span class="chip">${fmt(F)}</span>`,
ok?`Only 2 and/or 5 in q, so it <b class="zero">terminates</b>.`:`Prime factor <b class="hl">${bad[0]}</b> is not 2 or 5, so it <b class="hl">repeats</b>.`,
`${P}/${Q} = <div class="dig">${ip}.${spans}${!ok&&st<0?'…':''}</div>`,
`§${ok?'Terminating':'Non-terminating repeating'}`]}},
{name:'5 · a + b√c',title:'The a + b√c Type',tag:'Isolate the root. Spot the contradiction.',
key:'To prove a + b√c irrational, assume it is rational, then isolate √c. √c would be rational, which is a contradiction.',
facts:['Examples: 3 + 2√5, 5 − √3, 7√2, 4 − 3√7.','Assume the whole number is rational: a + b√c = r.','Isolate the root: √c = (r − a)/b, which is rational.','But √c is irrational (proved earlier), so this is a <b>contradiction</b>. Always write it.'],
inputs:[['a',3],['b',2],['c',5]],
build([a,b,c]){if(!isPrime(c)||!b||!Number.isInteger(a)||!Number.isInteger(b))return['<div class="bad">Enter a prime c and b ≠ 0. For a minus sign use a negative b (5 − √3 means a=5, b=-1, c=3).</div>'];
const ab=Math.abs(b),E=(a?a+(b<0?' − ':' + '):(b<0?'−':''))+(ab==1?'':ab)+'√'+c;
const ra=a?`r ${a<0?'+':'−'} ${Math.abs(a)}`:'r',bt=(b==1?'':b==-1?'−':b)+'√'+c,bd=b<0?`(${b})`:b;
return[`<b>Step 1.</b> Assume <span class="chip">${E}</span> is rational. Let ${E} = r, where r is rational.`,
`<b>Step 2.</b> Isolate the root: ${bt} = ${ra}, so <b class="zero">√${c} = (${ra}) / ${bd}</b>.`,
`<b>Step 3.</b> r, a and b are rational and b ≠ 0, so (${ra}) / ${bd} is rational. Hence √${c} is rational.`,
`<b>Step 4.</b> But √${c} is irrational (proved earlier). <b class="hl">This contradicts our assumption that ${E} is rational.</b>`,
`§Hence ${E} is <b>irrational</b>.`]}}
];

let cur=0,tok=0;
const nav=$('#nav'),main=$('#main');
POSTERS.forEach((P,i)=>{
 const b=document.createElement('button');b.textContent=P.name;b.onclick=()=>show(i);nav.appendChild(b);
 const s=document.createElement('section');s.className='poster';
 s.innerHTML=`<div><h1>${P.title}</h1><div class="tag">${P.tag}</div><ul class="facts">${P.facts.map(f=>`<li>${f}</li>`).join('')}</ul></div>
 <div><div class="ctl">${P.inputs.map(([n,v])=>`<label>${n}<input type="number" value="${v}" data-n="${n}"></label>`).join('')}
 <button class="go">Run</button><button class="st">Step</button><button class="rs">Reset</button></div><div class="stage"></div></div>`;
 main.appendChild(s);P.el=s;P.stage=$('.stage',s);
 $('.go',s).onclick=()=>play();$('.st',s).onclick=()=>step();$('.rs',s).onclick=()=>{tok++;kids().forEach(k=>k.classList.remove('on'))};
 s.querySelectorAll('input').forEach(inp=>inp.addEventListener('keydown',e=>{if(e.key==='Enter')play()}));
 s.addEventListener('keydown',e=>e.stopPropagation());
});
const kids=()=>[...POSTERS[cur].stage.children];
function build(){const P=POSTERS[cur];const v=[...P.el.querySelectorAll('input')].map(i=>+i.value);
 P.stage.innerHTML=`<div class="key">Important point: ${P.key}</div>`+P.build(v).map(h=>{const r=h.startsWith('§');return `<div class="${r?'result':''}${h.includes('class="bad"')?' bad':''}">${r?h.slice(1):h}</div>`}).join('')}
async function play(){build();const my=++tok;await sleep(300);for(const k of kids()){if(my!==tok)return;k.classList.add('on');await sleep(1500)}}
function step(){if(!kids().length||kids().every(k=>k.classList.contains('on'))&&!1)build();tok++;const n=kids().find(k=>!k.classList.contains('on'));if(n)n.classList.add('on');else{build();kids()[0].classList.add('on')}}
function show(i){tok++;cur=i;POSTERS.forEach((P,j)=>P.el.classList.toggle('on',j==i));[...nav.children].forEach((b,j)=>b.classList.toggle('on',j==i));play()}
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight')show((cur+1)%5);else if(e.key==='ArrowLeft')show((cur+4)%5);
 else if(e.key===' '){e.preventDefault();play()}else if(e.key==='s'||e.key==='S')step();
 else if(e.key==='h'||e.key==='H')document.body.classList.toggle('clean')});
show(Math.min(4,Math.max(0,(+location.hash.slice(1)||1)-1)));
</script>
</body>
</html>
